name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build TaskPulse AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Copy and Commit APK to Repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TaskPulseAI-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TaskPulseAI-debug.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build TaskPulseAI-debug.apk [skip ci]" && git push)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPulseAI-debug.apk
          path: TaskPulseAI-debug.apk
